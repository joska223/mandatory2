name: MAT-MEK4270 mandatory 2

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: uv sync
    - name: Type check with ty (informational, does not block the badge)
      continue-on-error: true
      run: uv run ty check galerkin.py
    - name: Test with pytest
      run: |
        uv run pytest -v -W ignore::pytest.PytestCollectionWarning galerkin.py
